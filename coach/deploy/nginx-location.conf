# Add inside the existing server { } block for compucore3.setu.ie.
# The app then calls https://compucore3.setu.ie/rgg-coach/coach
location /rgg-coach/ {
    proxy_pass http://127.0.0.1:8100/;   # trailing slash strips the /rgg-coach prefix
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 90s;
    client_max_body_size 256k;

    # Per-IP limit on top of the per-class daily allowance; define the zone
    # once in the http { } block:
    #   limit_req_zone $binary_remote_addr zone=rggcoach:1m rate=20r/m;
    limit_req zone=rggcoach burst=10 nodelay;
}
