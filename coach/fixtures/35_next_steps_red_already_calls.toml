description = "NEXT STEPS, Red: the user's case. The test already calls fizzBuzz and passes, so: make it fail for the right reason"
mode = "next_steps"
phase = "red"
novice = true
problem = 'Write fizzBuzz(int n) that returns the number as a string, but "Fizz" for multiples of 3, "Buzz" for multiples of 5 and "FizzBuzz" for multiples of both.'
expected = "Red: one new test that fails for the right reason. The pair is new to TDD: give the reason in one short clause."
tests = '''
// test.cpp
#include "pch.h"
#include "fizz.hpp"

TEST(TestCaseName, TestName) {
  EXPECT_TRUE(fizzBuzz(1) == "1");
}
'''
code = '''
// fizz.hpp
#include <string>
inline std::string fizzBuzz(int n) {
  return std::to_string(n);
}
'''
test_result = "All 1 tests passed"

[expect]
# the test calls fizzBuzz and passes: the "passed straight away" case
steps_first = ["red.new_test_passes_already", "red.pick_new_behaviour", "red.make_it_fail_for_right_reason", "red.next_example"]
steps_exclude = ["red.call_missing_function"]
detail_mentions = ["fizzBuzz", "fizz.hpp", "TestName"]
detail_suggests = ["3", "5", "15", "Fizz", "Buzz"]
