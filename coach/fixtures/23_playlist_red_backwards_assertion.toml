}

TEST(Song, DifferentArtistNotEqual) {
  Song a{"Hallelujah", "Leonard Cohen"};
  Song b{"Hallelujah", "Jeff Buckley"};
  EXPECT_TRUE(a == b);
}

TEST(Playlist, ParseNormalSplit) {
  Song s = parseSong("Hey Jude - The Beatles");
  EXPECT_EQ("Hey Jude", s.title);
  EXPECT_EQ("The Beatles", s.artist);
}
'''
