description = "ORIENT, looks_done: FizzBuzz with every rule tested and passing; suggest finishing or an edge case"
mode = "orient"
problem = 'Write fizzBuzz(int n) that returns the number as a string, but "Fizz" for multiples of 3, "Buzz" for multiples of 5 and "FizzBuzz" for multiples of both.'
tests = '''
// test.cpp
#include "fizz.hpp"
TEST(FizzBuzz, OneIsOne) { EXPECT_EQ("1", fizzBuzz(1)); }
TEST(FizzBuzz, TwoIsTwo) { EXPECT_EQ("2", fizzBuzz(2)); }
TEST(FizzBuzz, ThreeIsFizz) { EXPECT_EQ("Fizz", fizzBuzz(3)); }
TEST(FizzBuzz, SixIsFizz) { EXPECT_EQ("Fizz", fizzBuzz(6)); }
TEST(FizzBuzz, FiveIsBuzz) { EXPECT_EQ("Buzz", fizzBuzz(5)); }
TEST(FizzBuzz, TenIsBuzz) { EXPECT_EQ("Buzz", fizzBuzz(10)); }
TEST(FizzBuzz, FifteenIsFizzBuzz) { EXPECT_EQ("FizzBuzz", fizzBuzz(15)); }
TEST(FizzBuzz, ThirtyIsFizzBuzz) { EXPECT_EQ("FizzBuzz", fizzBuzz(30)); }
'''
code = '''
// fizz.hpp
#include <string>
inline std::string fizzBuzz(int n) {
  if (n % 15 == 0) return "FizzBuzz";
  if (n % 3 == 0) return "Fizz";
  if (n % 5 == 0) return "Buzz";
  return std::to_string(n);
}
'''
test_result = "All 8 tests passed"

[expect]
code_state = ["looks_done"]
building_mentions = ["Fizz"]
first_move_mentions = ["finish", "Finish", "edge", "0", "negative", "zero"]
no_warnings = true
