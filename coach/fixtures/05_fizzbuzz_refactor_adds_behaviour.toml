description = "FizzBuzz: Refactor sneaks in untested Buzz behaviour"
phase = "refactor"
problem = 'Write fizzBuzz(int n) that returns the number as a string, but "Fizz" for multiples of 3, "Buzz" for multiples of 5 and "FizzBuzz" for multiples of both.'
tests_before = '''
TEST(FizzBuzz, Returns1For1) { EXPECT_EQ("1", fizzBuzz(1)); }
TEST(FizzBuzz, Returns2For2) { EXPECT_EQ("2", fizzBuzz(2)); }
TEST(FizzBuzz, ReturnsFizzFor3) { EXPECT_EQ("Fizz", fizzBuzz(3)); }
TEST(FizzBuzz, ReturnsFizzFor6) { EXPECT_EQ("Fizz", fizzBuzz(6)); }
'''
code_before = '''
std::string fizzBuzz(int n) {
  if (n % 3 == 0) return "Fizz";
  return std::to_string(n);
}
'''
tests = '''
TEST(FizzBuzz, Returns1For1) { EXPECT_EQ("1", fizzBuzz(1)); }
TEST(FizzBuzz, Returns2For2) { EXPECT_EQ("2", fizzBuzz(2)); }
TEST(FizzBuzz, ReturnsFizzFor3) { EXPECT_EQ("Fizz", fizzBuzz(3)); }
TEST(FizzBuzz, ReturnsFizzFor6) { EXPECT_EQ("Fizz", fizzBuzz(6)); }
'''
code = '''
const std::string FIZZ = "Fizz";
const std::string BUZZ = "Buzz";

std::string fizzBuzz(int n) {
  if (n % 3 == 0) return FIZZ;
  if (n % 5 == 0) return BUZZ;
  return std::to_string(n);
}
'''
test_result = "All 4 tests passed"

[expect]
decision = ["redo"]
