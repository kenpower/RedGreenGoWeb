description = "FizzBuzz: Finish when every case is tested and passing"
phase = "finish"
problem = 'Write fizzBuzz(int n) that returns the number as a string, but "Fizz" for multiples of 3, "Buzz" for multiples of 5 and "FizzBuzz" for multiples of both.'
tests = '''
TEST(FizzBuzz, Returns1For1) { EXPECT_EQ("1", fizzBuzz(1)); }
TEST(FizzBuzz, Returns2For2) { EXPECT_EQ("2", fizzBuzz(2)); }
TEST(FizzBuzz, ReturnsFizzFor3) { EXPECT_EQ("Fizz", fizzBuzz(3)); }
TEST(FizzBuzz, ReturnsFizzFor6) { EXPECT_EQ("Fizz", fizzBuzz(6)); }
TEST(FizzBuzz, ReturnsBuzzFor5) { EXPECT_EQ("Buzz", fizzBuzz(5)); }
TEST(FizzBuzz, ReturnsBuzzFor10) { EXPECT_EQ("Buzz", fizzBuzz(10)); }
TEST(FizzBuzz, ReturnsFizzBuzzFor15) { EXPECT_EQ("FizzBuzz", fizzBuzz(15)); }
TEST(FizzBuzz, ReturnsFizzBuzzFor30) { EXPECT_EQ("FizzBuzz", fizzBuzz(30)); }
'''
code = '''
bool isMultiple(int n, int divisor) { return n % divisor == 0; }

std::string fizzBuzz(int n) {
  if (isMultiple(n, 15)) return "FizzBuzz";
  if (isMultiple(n, 3)) return "Fizz";
  if (isMultiple(n, 5)) return "Buzz";
  return std::to_string(n);
}
'''
test_result = "All 8 tests passed"

[expect]
decision = ["advance"]
likely_finished = true
