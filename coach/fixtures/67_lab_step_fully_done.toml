code = '''
ConnectFour ConnectFour::play(int column, char player) const {
    std::string newBoard = board;
    for (int row = 5; row >= 0; row--) {
        if (newBoard[row * NUM_COLS + column] == '-') {
            newBoard[row * NUM_COLS + column] = player;
            break;
        }
    }
    return ConnectFour(newBoard);
}

int ConnectFour::bestMoveFor(char player) const {
    for (int column = 0; column < NUM_COLS; column++) {
        if (board[column] == '-') {
            ConnectFour afterMove = play(column, player);
            if (afterMove.winner() == player)
                return column;
        }
    }
    for (int column = 0; column < NUM_COLS; column++) {
        if (board[column] == '-')
            return column;
    }
    return -1;
}
