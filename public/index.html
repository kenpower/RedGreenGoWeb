<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset='utf-8'>
	<meta name='viewport' content='width=device-width,initial-scale=1'>
	<meta name="color-scheme" content="dark">

	<title>Red Green Go!</title>

	<link rel='icon' type='image/png' href='favicon.png'>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@300;400;500;700&display=swap'>
	<link rel='stylesheet' href='global.css'>

</head>

<body>
	<script>
		// GitHub Pages lets browsers cache files for 10 minutes, so ask for the current
		// release (build/version.txt, never cached) and load the bundle as ?v=<release>.
		// If that fails, load it plain so the game still works.
		(function () {
			function load(v) {
				var q = v ? '?v=' + encodeURIComponent(v) : '';
				var css = document.createElement('link');
				css.rel = 'stylesheet';
				css.href = 'build/bundle.css' + q;
				document.head.appendChild(css);
				var js = document.createElement('script');
				js.src = 'build/bundle.js' + q;
				document.body.appendChild(js);
			}
			fetch('build/version.txt', { cache: 'no-store' })
				.then(function (r) { return r.ok ? r.text() : ''; })
				.then(function (t) { t = t.trim(); load(/^[\w.-]{1,40}$/.test(t) ? t : ''); }, function () { load(''); });
		})();
	</script>
</body>
</html>
